<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hackingale's portfolio</title>
<meta name="description" content="Browse hackingale's portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e10;--surface:#1a1a1f;--surface-hover:#25252b;
  --border:#2a2a32;--text:#e8e6e1;--text-dim:#8a8a8e;
  --accent:#c9a96e;--accent-glow:rgba(201,169,110,.15);--paper:#f5f2eb;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;user-select:none}

#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s,visibility .6s}
#loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loading-screen h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:400;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:2rem}
.loader-bar{width:200px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;position:relative}
.loader-bar::after{content:'';position:absolute;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:ls 1.2s ease-in-out infinite}
@keyframes ls{0%{left:-40%}100%{left:100%}}
#load-progress{margin-top:1rem;font-size:.8rem;color:var(--text-dim);letter-spacing:.1em}
#load-error{display:none;margin-top:2rem;text-align:center}
#load-error p{color:#e74c3c;font-size:.9rem;margin-bottom:1rem}
#load-error label{display:inline-block;padding:.6rem 1.5rem;border:1px solid var(--accent);color:var(--accent);border-radius:8px;cursor:pointer;transition:all .3s;font-size:.85rem}
#load-error label:hover{background:var(--accent-glow)}
#load-error input{display:none}

#viewer{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
#viewer.visible{opacity:1;visibility:visible}

.topbar{height:56px;display:flex;align-items:center;padding:0 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);gap:1rem;flex-shrink:0;z-index:100}
.topbar-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-controls{display:flex;align-items:center;gap:.25rem}
.btn{background:transparent;border:1px solid transparent;color:var(--text-dim);width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border)}
.btn.active{color:var(--accent);background:var(--accent-glow);border-color:var(--accent)}
.btn svg{width:18px;height:18px}
.divider{width:1px;height:24px;background:var(--border);margin:0 .25rem}
.page-indicator{font-size:.8rem;color:var(--text-dim);min-width:80px;text-align:center;letter-spacing:.05em}
.page-indicator span{color:var(--text);font-weight:500}
.zoom-display{font-size:.75rem;color:var(--text-dim);min-width:44px;text-align:center}

.book-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1a1a1f 0%,#0e0e10 70%)}
.book-container{position:relative;transition:transform .3s;transform-origin:center center}

.book-spread{display:flex;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.4),0 15px 50px rgba(0,0,0,.3);border-radius:3px}
.book-page{position:relative;background:var(--paper);overflow:hidden}
.book-page canvas{display:block}
.book-page.left{border-radius:3px 0 0 3px}
.book-page.right{border-radius:0 3px 3px 0}
.book-page.single-page{border-radius:3px}
.book-page.left::after{content:'';position:absolute;top:0;right:0;width:30px;height:100%;background:linear-gradient(to left,rgba(0,0,0,.07),transparent);pointer-events:none}
.book-page.right::after{content:'';position:absolute;top:0;left:0;width:30px;height:100%;background:linear-gradient(to right,rgba(0,0,0,.07),transparent);pointer-events:none}
.book-page.single-page::after{display:none}
.book-spine{position:absolute;top:-2px;bottom:-2px;left:50%;width:20px;transform:translateX(-50%);background:linear-gradient(to right,transparent 0%,rgba(0,0,0,.12) 35%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.12) 65%,transparent 100%);z-index:10;pointer-events:none}

.flip-overlay{position:absolute;top:0;width:50%;height:100%;z-index:20;perspective:2000px;overflow:hidden;pointer-events:none}
.flip-sheet{position:absolute;top:0;width:100%;height:100%;transform-style:preserve-3d}
.flip-face{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.flip-face canvas{display:block;width:100%;height:100%}
.flip-face.back{transform:rotateY(180deg)}

.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;z-index:200;opacity:.7}
.nav-arrow:hover{opacity:1;background:var(--surface-hover);color:var(--accent);border-color:var(--accent)}
.nav-arrow.disabled{opacity:.2;pointer-events:none}
.nav-arrow.left{left:1.5rem}
.nav-arrow.right{right:1.5rem}
.nav-arrow svg{width:20px;height:20px}

.thumb-strip{height:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;gap:8px;padding:0;transition:height .35s,padding .35s;flex-shrink:0}
.thumb-strip.open{height:110px;padding:10px 1rem}
.thumb-strip::-webkit-scrollbar{height:4px}
.thumb-strip::-webkit-scrollbar-track{background:transparent}
.thumb-strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.thumb{flex-shrink:0;width:64px;height:90px;border-radius:4px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative;background:var(--paper)}
.thumb:hover{border-color:var(--text-dim)}
.thumb.active{border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.thumb canvas{width:100%;height:100%;display:block}
.thumb-num{position:absolute;bottom:2px;right:3px;font-size:.55rem;color:var(--text-dim);background:rgba(0,0,0,.5);padding:1px 4px;border-radius:2px}

#zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:5000;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}
#zoom-overlay.active{display:flex}
#zoom-overlay canvas{max-width:92vw;max-height:88vh;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.zoom-close{position:fixed;top:1rem;right:1rem;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5001;font-size:1.2rem}
.zoom-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5001;transition:all .2s}
.zoom-nav:hover{border-color:var(--accent);color:var(--accent)}
.zoom-nav.zl{left:1rem}
.zoom-nav.zr{right:1rem}
.zoom-nav svg{width:18px;height:18px}
.zoom-pn{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);font-size:.85rem;color:var(--text-dim);background:var(--surface);padding:4px 14px;border-radius:20px;border:1px solid var(--border);z-index:5001}

.kb-hint{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--text-dim);letter-spacing:.05em;opacity:.5;pointer-events:none;z-index:10;white-space:nowrap}
.kb-hint kbd{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-family:inherit;font-size:.65rem;margin:0 1px}

@media(max-width:768px){
  .topbar{padding:0 .75rem;height:48px}
  .topbar-title{font-size:.85rem}
  .nav-arrow{width:40px;height:40px}
  .nav-arrow.left{left:.5rem}
  .nav-arrow.right{right:.5rem}
  .kb-hint{display:none}
}
</style>
</head>
<body>

<div id="loading-screen">
  <h1>hackingale</h1>
  <div class="loader-bar"></div>
  <div id="load-progress">Loading portfolio…</div>
  <div id="load-error">
    <p>Could not find portfolio.pdf</p>
    <label>Upload PDF manually<input type="file" id="pdf-input" accept=".pdf"></label>
  </div>
</div>

<div id="viewer">
  <div class="topbar">
    <div class="topbar-title" id="doc-title">hackingale</div>
    <div class="topbar-controls">
      <div class="page-indicator"><span id="current-spread">1</span> / <span id="total-pages">0</span></div>
      <div class="divider"></div>
      <button class="btn" id="btn-zo" title="Zoom Out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <div class="zoom-display" id="zoom-display">100%</div>
      <button class="btn" id="btn-zi" title="Zoom In"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <div class="divider"></div>
      <button class="btn" id="btn-expand" title="Enlarge page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
      <button class="btn" id="btn-thumbs" title="Thumbnails"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
      <button class="btn" id="btn-fs" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    </div>
  </div>
  <div class="book-area" id="book-area">
    <button class="nav-arrow left" id="nav-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="book-container" id="book-container">
      <div class="book-spread" id="book-spread">
        <div class="book-page left" id="page-left"></div>
        <div class="book-page right" id="page-right"></div>
        <div class="book-spine" id="book-spine"></div>
      </div>
    </div>
    <button class="nav-arrow right" id="nav-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="thumb-strip" id="thumb-strip"></div>
  <div class="kb-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> navigate · <kbd>Scroll</kbd> flip · <kbd>+</kbd> <kbd>-</kbd> zoom · <kbd>F</kbd> fullscreen · double-click enlarge</div>
</div>

<div id="zoom-overlay">
  <button class="zoom-close" id="zoom-close">&times;</button>
  <button class="zoom-nav zl" id="zn-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button class="zoom-nav zr" id="zn-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  <canvas id="zoom-canvas"></canvas>
  <div class="zoom-pn" id="zoom-pn">1</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdfDoc=null,pageImgs=[],pageCount=0,curSpread=0,zoom=1,flipping=false,zoomPg=0;
var ZMIN=.5,ZMAX=2,ZSTEP=.15,A4=297/210,pw=0,ph=0;
var spreads=[];
var g=function(id){return document.getElementById(id)};

function buildSpreads(){
  spreads=[];
  if(pageCount===0)return;
  spreads.push([0]);
  var i=1;
  while(i<pageCount){
    if(i+1<pageCount){spreads.push([i,i+1]);i+=2}
    else{spreads.push([i]);i++}
  }
}
function isSingle(s){return spreads[s]&&spreads[s].length===1}

fetch('portfolio.pdf').then(function(r){
  if(r.ok)return r.blob();throw 0;
}).then(function(b){loadPDF(b)}).catch(function(){
  g('load-progress').style.display='none';
  g('load-error').style.display='block';
});
g('pdf-input').addEventListener('change',function(e){
  if(e.target.files[0]){g('load-error').style.display='none';g('load-progress').style.display='block';loadPDF(e.target.files[0])}
});

function loadPDF(src){
  (src instanceof Blob?src.arrayBuffer():Promise.resolve(src)).then(function(buf){
    return pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(doc){
    pdfDoc=doc;pageCount=doc.numPages;g('total-pages').textContent=pageCount;
    pageImgs=[];var chain=Promise.resolve();
    for(var i=1;i<=pageCount;i++)(function(idx){
      chain=chain.then(function(){
        g('load-progress').textContent='Rendering page '+idx+' / '+pageCount;
        return doc.getPage(idx);
      }).then(function(pg){
        var vp=pg.getViewport({scale:2}),c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;var ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        return pg.render({canvasContext:ctx,viewport:vp}).promise.then(function(){pageImgs.push(c)});
      });
    })(i);
    return chain;
  }).then(function(){
    buildSpreads();g('loading-screen').classList.add('hidden');g('viewer').classList.add('visible');
    curSpread=0;doResize();renderSpread();buildThumbs();
  });
}

function doResize(){
  var area=g('book-area'),aH=area.clientHeight-60,aW=area.clientWidth-160;
  ph=Math.min(aH,750);pw=ph/A4;
  if(pw*2>aW){pw=aW/2;ph=pw*A4}
  pw=Math.floor(pw);ph=Math.floor(ph);
  layoutSpread();
  g('book-container').style.transform='scale('+zoom+')';
  g('zoom-display').textContent=Math.round(zoom*100)+'%';
}

function layoutSpread(){
  var sp=g('book-spread'),pl=g('page-left'),pr=g('page-right'),spine=g('book-spine');
  if(isSingle(curSpread)){
    sp.style.width=pw+'px';sp.style.height=ph+'px';
    pl.style.width=pw+'px';pl.style.height=ph+'px';pl.style.display='block';pl.className='book-page single-page';
    pr.style.display='none';spine.style.display='none';
  }else{
    sp.style.width=(pw*2)+'px';sp.style.height=ph+'px';
    pl.style.width=pw+'px';pl.style.height=ph+'px';pl.style.display='block';pl.className='book-page left';
    pr.style.width=pw+'px';pr.style.height=ph+'px';pr.style.display='block';pr.className='book-page right';
    spine.style.display='block';
  }
}

function drawInto(el,idx){
  el.innerHTML='';if(idx<0||idx>=pageCount)return;
  var c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;
  var w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;
  c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
  c.getContext('2d').drawImage(pageImgs[idx],0,0,c.width,c.height);el.appendChild(c);
}

function renderSpread(){
  layoutSpread();var p=spreads[curSpread];if(!p)return;
  if(p.length===1){drawInto(g('page-left'),p[0])}
  else{drawInto(g('page-left'),p[0]);drawInto(g('page-right'),p[1])}
  updateUI();
}

function updateUI(){
  var p=spreads[curSpread];if(!p)return;
  g('current-spread').textContent=p.length===1?(p[0]+1):((p[0]+1)+'–'+(p[1]+1));
  g('nav-prev').classList.toggle('disabled',curSpread<=0);
  g('nav-next').classList.toggle('disabled',curSpread>=spreads.length-1);
  hlThumbs();
}

function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

function flipNext(){
  if(flipping||curSpread>=spreads.length-1)return;flipping=true;
  var cont=g('book-container'),cur=spreads[curSpread],nxt=spreads[curSpread+1];
  var flipIdx=cur.length===1?cur[0]:cur[1];
  var revIdx=nxt[0];
  curSpread++;layoutSpread();
  var np=spreads[curSpread];
  if(np.length===1)drawInto(g('page-left'),np[0]);
  else{drawInto(g('page-left'),np[0]);drawInto(g('page-right'),np[1])}

  var ov=document.createElement('div');ov.className='flip-overlay';
  ov.style.cssText=(cur.length===1?'left:0':'right:0')+';width:'+pw+'px;height:'+ph+'px;display:block';
  var sheet=document.createElement('div');sheet.className='flip-sheet';sheet.style.transformOrigin='left center';
  var dpr=window.devicePixelRatio||1;

  var fr=document.createElement('div');fr.className='flip-face';
  var fc=document.createElement('canvas');fc.width=pw*dpr;fc.height=ph*dpr;fc.style.width='100%';fc.style.height='100%';
  if(flipIdx>=0&&flipIdx<pageCount)fc.getContext('2d').drawImage(pageImgs[flipIdx],0,0,fc.width,fc.height);
  fr.appendChild(fc);

  var bk=document.createElement('div');bk.className='flip-face back';
  var bc=document.createElement('canvas');bc.width=pw*dpr;bc.height=ph*dpr;bc.style.width='100%';bc.style.height='100%';
  if(revIdx>=0&&revIdx<pageCount)bc.getContext('2d').drawImage(pageImgs[revIdx],0,0,bc.width,bc.height);
  bk.appendChild(bc);

  sheet.appendChild(fr);sheet.appendChild(bk);ov.appendChild(sheet);cont.appendChild(ov);
  var t0=performance.now();
  (function tick(now){
    var t=Math.min((now-t0)/650,1);sheet.style.transform='rotateY('+(-ease(t)*180)+'deg)';
    if(t<1)requestAnimationFrame(tick);else{cont.removeChild(ov);renderSpread();flipping=false}
  })(t0);
}

function flipPrev(){
  if(flipping||curSpread<=0)return;flipping=true;
  var cont=g('book-container'),cur=spreads[curSpread],prv=spreads[curSpread-1];
  var flipIdx=cur.length===1?cur[0]:cur[0];
  var revIdx=prv.length>1?prv[1]:prv[0];
  curSpread--;layoutSpread();
  var np=spreads[curSpread];
  if(np.length===1)drawInto(g('page-left'),np[0]);
  else{drawInto(g('page-left'),np[0]);drawInto(g('page-right'),np[1])}

  var ov=document.createElement('div');ov.className='flip-overlay';
  ov.style.cssText='left:0;width:'+pw+'px;height:'+ph+'px;display:block';
  var sheet=document.createElement('div');sheet.className='flip-sheet';sheet.style.transformOrigin='right center';
  var dpr=window.devicePixelRatio||1;

  var fr=document.createElement('div');fr.className='flip-face';
  var fc=document.createElement('canvas');fc.width=pw*dpr;fc.height=ph*dpr;fc.style.width='100%';fc.style.height='100%';
  if(flipIdx>=0&&flipIdx<pageCount)fc.getContext('2d').drawImage(pageImgs[flipIdx],0,0,fc.width,fc.height);
  fr.appendChild(fc);

  var bk=document.createElement('div');bk.className='flip-face back';
  var bc=document.createElement('canvas');bc.width=pw*dpr;bc.height=ph*dpr;bc.style.width='100%';bc.style.height='100%';
  if(revIdx>=0&&revIdx<pageCount)bc.getContext('2d').drawImage(pageImgs[revIdx],0,0,bc.width,bc.height);
  bk.appendChild(bc);

  sheet.appendChild(fr);sheet.appendChild(bk);ov.appendChild(sheet);cont.appendChild(ov);
  var t0=performance.now();
  (function tick(now){
    var t=Math.min((now-t0)/650,1);sheet.style.transform='rotateY('+(ease(t)*180)+'deg)';
    if(t<1)requestAnimationFrame(tick);else{cont.removeChild(ov);renderSpread();flipping=false}
  })(t0);
}

function goTo(idx){for(var s=0;s<spreads.length;s++){if(spreads[s].indexOf(idx)!==-1){curSpread=s;renderSpread();return}}}

g('nav-next').onclick=flipNext;g('nav-prev').onclick=flipPrev;
g('page-left').onclick=function(){if(isSingle(curSpread))flipNext();else flipPrev()};
g('page-right').onclick=flipNext;

var wA=0;
g('book-area').addEventListener('wheel',function(e){e.preventDefault();wA+=e.deltaY;if(Math.abs(wA)>60){wA>0?flipNext():flipPrev();wA=0}},{passive:false});

function buildThumbs(){
  var s=g('thumb-strip');s.innerHTML='';
  for(var i=0;i<pageCount;i++){
    var t=document.createElement('div');t.className='thumb';t.setAttribute('data-p',i);
    var c=document.createElement('canvas');c.width=128;c.height=180;
    c.getContext('2d').drawImage(pageImgs[i],0,0,128,180);t.appendChild(c);
    var n=document.createElement('div');n.className='thumb-num';n.textContent=i+1;t.appendChild(n);
    (function(x){t.onclick=function(){goTo(x)}})(i);s.appendChild(t);
  }
}
function hlThumbs(){
  var ps=spreads[curSpread]||[],ts=g('thumb-strip').querySelectorAll('.thumb');
  for(var i=0;i<ts.length;i++){var p=parseInt(ts[i].getAttribute('data-p'));ts[i].classList.toggle('active',ps.indexOf(p)!==-1)}
  var a=g('thumb-strip').querySelector('.thumb.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function setZoom(z){zoom=Math.max(ZMIN,Math.min(ZMAX,z));g('book-container').style.transform='scale('+zoom+')';g('zoom-display').textContent=Math.round(zoom*100)+'%'}
g('btn-zi').onclick=function(){setZoom(zoom+ZSTEP)};g('btn-zo').onclick=function(){setZoom(zoom-ZSTEP)};

function showZoom(i){if(i<0||i>=pageCount)return;zoomPg=i;var s=pageImgs[i],z=g('zoom-canvas');z.width=s.width;z.height=s.height;z.getContext('2d').drawImage(s,0,0);g('zoom-pn').textContent='Page '+(i+1)+' / '+pageCount;g('zoom-overlay').classList.add('active')}
function closeZoom(){g('zoom-overlay').classList.remove('active')}
g('btn-expand').onclick=function(){showZoom(spreads[curSpread][0])};
g('zoom-close').onclick=closeZoom;
g('zoom-overlay').onclick=function(e){if(e.target===this)closeZoom()};
g('zn-left').onclick=function(e){e.stopPropagation();if(zoomPg>0)showZoom(zoomPg-1)};
g('zn-right').onclick=function(e){e.stopPropagation();if(zoomPg<pageCount-1)showZoom(zoomPg+1)};
g('zoom-overlay').addEventListener('wheel',function(e){e.preventDefault();if(e.deltaY>0&&zoomPg<pageCount-1)showZoom(zoomPg+1);else if(e.deltaY<0&&zoomPg>0)showZoom(zoomPg-1)},{passive:false});
g('page-left').ondblclick=function(e){e.stopPropagation();showZoom(spreads[curSpread][0])};
g('page-right').ondblclick=function(e){e.stopPropagation();var p=spreads[curSpread];if(p.length>1)showZoom(p[1])};

g('btn-thumbs').onclick=function(){g('thumb-strip').classList.toggle('open');this.classList.toggle('active')};
g('btn-fs').onclick=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen()};

document.addEventListener('keydown',function(e){
  if(g('zoom-overlay').classList.contains('active')){
    if(e.key==='Escape')closeZoom();if(e.key==='ArrowLeft'&&zoomPg>0)showZoom(zoomPg-1);if(e.key==='ArrowRight'&&zoomPg<pageCount-1)showZoom(zoomPg+1);return;
  }
  if(e.key==='ArrowRight'||e.key===' '){flipNext();e.preventDefault()}
  else if(e.key==='ArrowLeft'){flipPrev();e.preventDefault()}
  else if(e.key==='+'||e.key==='=')setZoom(zoom+ZSTEP);
  else if(e.key==='-')setZoom(zoom-ZSTEP);
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen()}
});

var tx=0;
g('book-area').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
g('book-area').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?flipNext():flipPrev()}},{passive:true});
window.addEventListener('resize',function(){if(pdfDoc){doResize();renderSpread()}});
</script>
</body>
</html>
